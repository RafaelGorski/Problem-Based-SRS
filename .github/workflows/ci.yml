name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (canvas + skill evals)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # release-hygiene.test.mjs asks whether every changelog section below the
          # manifest version has a tag behind it. actions/checkout fetches none by
          # default, and a tagless checkout is no evidence — the guard would skip on
          # every CI run and guard nothing.
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # release-hygiene.test.mjs and stranded-release-claim.test.mjs cross-check
      # build-plugin.py by *executing* it rather than restating its rules. Without an
      # interpreter both legs skip, and a leg that always skips proves nothing.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # No `npm ci` needed: the deterministic suites import only node:test /
      # node:assert. Playwright-driven specs are excluded from `npm test`.
      - name: Canvas extension tests
        working-directory: .github/extensions/srs-navigator
        run: npm test

      - name: Deterministic skill evals
        run: node --test evals/tests/*.test.mjs

  e2e:
    name: Canvas e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/extensions/srs-navigator/package-lock.json

      - name: Install dependencies
        working-directory: .github/extensions/srs-navigator
        run: npm ci

      - name: Install Chromium
        working-directory: .github/extensions/srs-navigator
        run: npx playwright install --with-deps chromium

      # playwright.config.mjs starts scripts/serve-canvas.mjs itself, so no
      # separate server step is needed here.
      - name: Run visual suite
        working-directory: .github/extensions/srs-navigator
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: .github/extensions/srs-navigator/playwright-report
          if-no-files-found: ignore

  build:
    name: Build & validate plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate plugin manifest and skills
        run: python scripts/build-plugin.py validate

      - name: Package distributable plugin
        id: package
        run: python scripts/build-plugin.py package

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: dist/*.zip
          if-no-files-found: error
