name: Create Release

# Build & release pipeline: validates the plugin, packages a distributable
# artifact, and publishes a GitHub Release with the artifact attached.
#
# The normal path is the Thursday dispatcher (`thursday-release.yml`), which calls this
# workflow on the default branch after the report window. Manual dispatch remains available
# for rehearsals, recoveries, and exceptional releases. The release tag is created by
# `gh release create --target`, not by a pushed git tag, so this workflow no longer has any
# release path that fires automatically outside the Thursday cadence.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.3 (defaults to plugin.json)"
        required: false
        type: string
      release_name:
        description: "Release name suffix, e.g. Enhanced Traceability"
        required: false
        type: string
      release_body:
        description: "Release notes override (defaults to CHANGELOG.md section)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, package & publish release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse to release from anywhere but the default branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::create-release.yml must run on $DEFAULT_BRANCH; got $REF_NAME"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Resolve raw version
        id: raw
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Invalid release version: '$VERSION'. Expected X.Y or X.Y.Z."
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build, validate & package
        id: build
        env:
          RAW_VERSION: ${{ steps.raw.outputs.version }}
        run: python scripts/build-plugin.py build --version "$RAW_VERSION"

      - name: Determine release notes
        id: notes
        env:
          RELEASE_BODY: ${{ inputs.release_body }}
          BUILD_VERSION: ${{ steps.build.outputs.version }}
        run: |
          if [ -n "$RELEASE_BODY" ]; then
            delimiter="EOF_NOTES_$(uuidgen)"
            while [[ "$RELEASE_BODY" == *"$delimiter"* ]]; do
              delimiter="EOF_NOTES_$(uuidgen)"
            done
            {
              printf 'body<<%s\n' "$delimiter"
              printf '%s\n' "$RELEASE_BODY"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<EOF_NOTES"
              GITHUB_OUTPUT="" python scripts/build-plugin.py notes --version "$BUILD_VERSION"
              echo "EOF_NOTES"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_NAME: ${{ inputs.release_name }}
          NOTES: ${{ steps.notes.outputs.body }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          TAG="v${VERSION}"
          if [ -n "$RELEASE_NAME" ]; then
            TITLE="🎉 Version ${VERSION} - ${RELEASE_NAME}"
          else
            TITLE="🎉 Version ${VERSION}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; updating notes and assets."
            printf '%s' "$NOTES" | gh release edit "$TAG" --title "$TITLE" --notes-file -
            gh release upload "$TAG" "$ARTIFACT" --clobber
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$NOTES" | gh release create "$TAG" \
              --target "$GITHUB_SHA_VALUE" \
              --title "$TITLE" \
              --notes-file - \
              "$ARTIFACT"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Published $TAG with asset: $ARTIFACT"

      - name: Verify downloaded release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_CREATED: ${{ steps.publish.outputs.created }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_EVENT_NAME_VALUE: ${{ github.event_name }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
        run: |
          TAG="v${VERSION}"
          mkdir -p release-asset
          ASSET=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | startswith("problem-based-srs-")) | .name' | head -n 1)
          test -n "$ASSET"
          gh release download "$TAG" --pattern "$ASSET" --dir release-asset
          FILE="release-asset/$ASSET"
          LOCAL_SHA=$(sha256sum "$FILE" | awk '{print $1}')
          API_DIGEST=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$ASSET\") | .digest // \"\"")
          if [ -n "$API_DIGEST" ]; then
           test "$LOCAL_SHA" = "${API_DIGEST#sha256:}"
          else
           echo "API digest unavailable"
          fi
          unzip -q "$FILE" -d release-asset/extracted
          node evals/tools/verify-plugin-archive.mjs release-asset/extracted \
           --json release-asset/plugin-archive.json
          gh release view "$TAG" --json tagName,targetCommitish,isDraft,isPrerelease,assets \
           > release-asset/release-metadata.json
          if [ "$RELEASE_CREATED" = "true" ]; then
           jq --arg sha "$GITHUB_SHA_VALUE" \
             'if .targetCommitish == $sha then . else error("release target does not match workflow head") end' \
             release-asset/release-metadata.json >/dev/null
          else
           echo "Existing release updated; retaining its original target commit."
          fi
          {
           echo "## Downloaded plugin release verification"
           echo "- **Tag:** $TAG"
           echo "- **Asset:** $ASSET"
           echo "- **Bytes SHA-256:** $LOCAL_SHA"
           echo "- **Run:** $GITHUB_RUN_ID_VALUE ($GITHUB_EVENT_NAME_VALUE, $GITHUB_REF_NAME_VALUE, $GITHUB_SHA_VALUE)"
           echo "- **Evidence:** release-asset/plugin-archive.json"
          } >> "$GITHUB_STEP_SUMMARY"
